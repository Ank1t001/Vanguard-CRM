<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Vanguard lead desk</title>
<meta name="theme-color" content="#1B2B4B">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lead desk">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F9; --panel:#FFFFFF; --ink:#1B2B4B; --ink-2:#4B5A78; --ink-3:#7A8699;
  --line:#DCE2EC; --line-2:#C9D2E0; --navy:#2E5596; --navy-soft:#E6EDF8;
  --olive:#5F7F1F; --olive-soft:#EEF3E2; --amber:#9A6206; --amber-soft:#FBF1DD;
  --red:#B42318; --red-soft:#FCE8E6; --focus:#2E5596;
  --sans:"Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111827; --panel:#182235; --ink:#E7ECF5; --ink-2:#B3BDD0; --ink-3:#8590A6;
    --line:#2A3650; --line-2:#3A4866; --navy:#8FB0E8; --navy-soft:#1F2E4D;
    --olive:#A8C46A; --olive-soft:#24301A; --amber:#E7B661; --amber-soft:#33280F;
    --red:#F08A80; --red-soft:#3A1C1A; --focus:#8FB0E8;
  }
}
:root[data-theme="dark"]{
  --bg:#111827; --panel:#182235; --ink:#E7ECF5; --ink-2:#B3BDD0; --ink-3:#8590A6;
  --line:#2A3650; --line-2:#3A4866; --navy:#8FB0E8; --navy-soft:#1F2E4D;
  --olive:#A8C46A; --olive-soft:#24301A; --amber:#E7B661; --amber-soft:#33280F;
  --red:#F08A80; --red-soft:#3A1C1A; --focus:#8FB0E8;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; min-height:100%; background:var(--bg); color:var(--ink); font:16px/1.45 var(--sans); -webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:6px}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

/* Sign in */
.gate{min-height:100vh; display:grid; place-items:center; padding:24px}
.gate-card{width:min(420px,100%); background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:32px}
.gate h1{font:600 30px/1.15 var(--serif); margin:0 0 8px}
.gate p{color:var(--ink-2); margin:0 0 20px}
.gate .demo-row{display:flex; gap:10px; flex-wrap:wrap}
.gate .err{color:var(--red); margin-top:14px}

/* Top bar */
.bar{display:flex; align-items:center; gap:16px; padding:14px 24px; background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:env(safe-area-inset-top,0px); z-index:5}
.brand{font:600 20px/1 var(--serif); white-space:nowrap}
.loc{font-weight:600; color:var(--navy)}
.loc select{border:1px solid var(--line-2); border-radius:8px; padding:4px 8px; background:var(--panel); color:var(--navy); font-weight:600}
.bar .spacer{flex:1}
.who{color:var(--ink-2); font-size:14px; white-space:nowrap}
.btn{border:1px solid var(--line-2); background:var(--panel); border-radius:8px; padding:8px 14px; font-weight:600}
.btn:hover{border-color:var(--navy)}
.btn.primary{background:var(--navy); border-color:var(--navy); color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0E1626}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0E1626}}
.btn.ghost{border-color:transparent; background:transparent; color:var(--ink-2)}
.btn.small{padding:5px 10px; font-size:14px}
.demo-flag{font-size:13px; color:var(--amber); background:var(--amber-soft); border-radius:999px; padding:3px 10px; white-space:nowrap}

/* Funnel rail: the spine of the page */
.rail{padding:18px 24px 6px; display:grid; gap:10px}
.path{display:grid; grid-template-columns:1.05fr repeat(5,1fr); gap:0}
.seg{position:relative; text-align:left; border:0; background:var(--panel); padding:12px 26px 12px 20px; min-height:96px;
  clip-path:polygon(0 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 0 100%, 14px 50%);
  margin-left:-8px; border-top:1px solid var(--line); border-bottom:1px solid var(--line)}
.seg:first-child{clip-path:polygon(0 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 0 100%); margin-left:0; border-radius:10px 0 0 10px; border-left:1px solid var(--line)}
.seg .n{font:600 28px/1 var(--serif)}
.seg .t{font-weight:700; margin-top:4px}
.seg .r{font-size:13px; color:var(--ink-2); line-height:1.3; margin-top:2px; max-width:22ch}
.seg:hover{background:var(--navy-soft)}
.seg[aria-pressed="true"]{background:var(--navy); color:#fff}
.seg[aria-pressed="true"] .r{color:rgba(255,255,255,.82)}
:root[data-theme="dark"] .seg[aria-pressed="true"]{color:#0E1626}
:root[data-theme="dark"] .seg[aria-pressed="true"] .r{color:#24324F}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .seg[aria-pressed="true"]{color:#0E1626}
  :root:not([data-theme="light"]) .seg[aria-pressed="true"] .r{color:#24324F}
}
.seg.callnow .n{color:var(--red)}
.seg.callnow[aria-pressed="true"] .n{color:inherit}
.side{display:flex; gap:8px; flex-wrap:wrap}
.pill{display:flex; align-items:baseline; gap:8px; border:1px solid var(--line); background:var(--panel); border-radius:999px; padding:6px 14px; text-align:left}
.pill .n{font:600 17px/1 var(--serif)}
.pill .t{font-weight:600}
.pill .r{font-size:13px; color:var(--ink-2)}
.pill:hover{border-color:var(--navy)}
.pill[aria-pressed="true"]{border-color:var(--navy); background:var(--navy-soft)}

/* Work area */
.work{display:grid; grid-template-columns:minmax(340px,440px) 1fr; gap:18px; padding:12px 24px 28px; align-items:start}
.list,.panel{background:var(--panel); border:1px solid var(--line); border-radius:12px}
.list-head{padding:16px 18px 12px; border-bottom:1px solid var(--line)}
.list-head h2{font:600 20px/1.2 var(--serif); margin:0}
.list-head p{margin:4px 0 0; color:var(--ink-2); font-size:14px}
.stats{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
.stat{font-size:13px; border-radius:6px; padding:3px 8px; background:var(--bg); color:var(--ink-2)}
.stat b{color:var(--ink)}
.stat.bad b{color:var(--red)}
.rows{list-style:none; margin:0; padding:0; max-height:calc(100vh - 340px); overflow:auto}
.row{display:block; width:100%; text-align:left; border:0; border-bottom:1px solid var(--line); background:transparent; padding:12px 18px}
.row:hover{background:var(--bg)}
.row[aria-current="true"]{background:var(--navy-soft); box-shadow:inset 3px 0 0 var(--navy)}
.row .top{display:flex; justify-content:space-between; gap:10px; align-items:baseline}
.row .name{font-weight:700}
.row .meta{font-size:14px; color:var(--ink-2); margin-top:2px}
.row .tags{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px}
.tag{font-size:12.5px; border-radius:6px; padding:2px 7px; background:var(--bg); color:var(--ink-2); border:1px solid var(--line)}
.tag.ok{background:var(--olive-soft); color:var(--olive); border-color:transparent}
.tag.again{background:var(--amber-soft); color:var(--amber); border-color:transparent}
.due{font-size:13px; font-weight:600; border-radius:6px; padding:2px 8px; white-space:nowrap; background:var(--bg); color:var(--ink-2)}
.due.soon{background:var(--amber-soft); color:var(--amber)}
.due.late{background:var(--red-soft); color:var(--red)}
.empty{padding:32px 18px; color:var(--ink-2)}

.panel{min-height:420px}
.panel .blank{padding:48px 28px; color:var(--ink-2)}
.panel .blank h3{font:600 20px/1.2 var(--serif); color:var(--ink); margin:0 0 6px}
.p-head{display:flex; gap:12px; align-items:flex-start; padding:20px 24px 14px; border-bottom:1px solid var(--line)}
.p-head h2{font:600 26px/1.15 var(--serif); margin:0}
.p-head .stage{display:inline-block; margin-top:6px; font-size:13px; font-weight:600; border-radius:999px; padding:2px 10px; background:var(--navy-soft); color:var(--navy)}
.p-head .close{margin-left:auto}
.p-body{padding:18px 24px 28px; display:grid; gap:22px}
.dial{display:inline-flex; align-items:center; gap:10px; background:var(--navy); color:#fff; text-decoration:none; font-weight:700; font-size:18px; border-radius:10px; padding:12px 18px}
:root[data-theme="dark"] .dial{color:#0E1626}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .dial{color:#0E1626}}
.contact{display:flex; gap:14px; align-items:center; flex-wrap:wrap}
.contact a.mail{color:var(--navy)}
.facts{display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:12px 20px; margin:0}
.facts dt{font-size:13px; color:var(--ink-3)}
.facts dd{margin:2px 0 0; font-weight:600}
.block h3{font:600 17px/1.2 var(--serif); margin:0 0 4px}
.block .hint{color:var(--ink-2); font-size:14px; margin:0 0 10px}
.outcomes{display:flex; gap:8px; flex-wrap:wrap}
.outcome{border:1px solid var(--line-2); background:var(--panel); border-radius:8px; padding:9px 14px; font-weight:600}
.outcome:hover{border-color:var(--navy)}
.outcome.good{border-color:var(--olive); color:var(--olive)}
.outcome.bad{color:var(--red)}
.calllog{list-style:none; margin:10px 0 0; padding:0; display:grid; gap:6px}
.calllog li{font-size:14px; color:var(--ink-2)}
.calllog b{color:var(--ink)}
.steps{display:flex; gap:8px; flex-wrap:wrap}
.step{border:1px solid var(--line-2); background:var(--panel); border-radius:8px; padding:8px 14px; font-weight:600}
.step[aria-pressed="true"]{border-color:var(--navy); background:var(--navy-soft); color:var(--navy)}
.form{display:grid; gap:10px; margin-top:12px; padding:14px; border:1px solid var(--line); border-radius:10px; background:var(--bg)}
.form label{display:grid; gap:4px; font-size:14px; font-weight:600}
.form input,.form select,.form textarea,.dlg input,.dlg select{border:1px solid var(--line-2); border-radius:8px; padding:9px 10px; background:var(--panel)}
.warn{font-size:14px; color:var(--amber); background:var(--amber-soft); border-radius:8px; padding:8px 10px}
.seg-ctl{display:inline-flex; border:1px solid var(--line-2); border-radius:8px; overflow:hidden}
.seg-ctl button{border:0; background:var(--panel); padding:7px 16px; font-weight:600; border-right:1px solid var(--line-2)}
.seg-ctl button:last-child{border-right:0}
.seg-ctl button[aria-pressed="true"]{background:var(--navy); color:#fff}
textarea{width:100%; min-height:80px; resize:vertical}
.notes{white-space:pre-wrap; font-size:14px; color:var(--ink-2); background:var(--bg); border-radius:8px; padding:10px 12px; margin-top:10px}
.log{list-style:none; margin:0; padding:0; display:grid; gap:6px; font-size:14px; color:var(--ink-2)}
.log time{color:var(--ink-3); margin-right:6px}

dialog.dlg{border:1px solid var(--line); border-radius:14px; padding:0; width:min(480px,94vw); background:var(--panel); color:var(--ink)}
dialog.dlg::backdrop{background:rgba(17,24,39,.45)}
.dlg form{padding:22px 24px; display:grid; gap:12px}
.dlg h2{font:600 22px/1.2 var(--serif); margin:0}
.dlg label{display:grid; gap:4px; font-size:14px; font-weight:600}
.dlg .two{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.dlg .actions{display:flex; justify-content:flex-end; gap:8px; margin-top:6px}

.toast{position:sticky; bottom:calc(16px + env(safe-area-inset-bottom,0px)); margin:0 auto; width:max-content; max-width:92vw; background:var(--ink); color:var(--panel); padding:10px 16px; border-radius:10px; font-weight:600; z-index:20}
.toast.err{background:var(--red); color:#fff}

@media (max-width: 1100px){
  .path{grid-template-columns:repeat(3,1fr); row-gap:6px}
  .seg,.seg:first-child{clip-path:none; margin-left:0; border:1px solid var(--line); border-radius:10px; min-height:auto}
  .path{gap:6px}
}
@media (max-width: 860px){
  .bar{padding:12px 14px; flex-wrap:wrap}
  .rail,.work{padding-left:14px; padding-right:14px}
  .work{grid-template-columns:1fr}
  .rows{max-height:none}
  .panel.open{position:fixed; inset:0; z-index:30; border-radius:0; overflow:auto; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
  .panel:not(.open){display:none}
  .path{grid-template-columns:repeat(2,1fr)}
  .seg .r{display:none}
  .pill .r{display:none}
  .pill .t{white-space:nowrap}
  .side{gap:6px}
}
@media (prefers-reduced-motion: no-preference){
  .row,.seg,.pill,.btn,.outcome,.step{transition:background-color .12s, border-color .12s}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast-host" aria-live="polite"></div>

<script>
/* ------------------------------------------------------------------
   Configuration comes from the server (/api/config), so nothing in this
   file needs editing. Add ?demo to the URL, or open the file without a
   server, and it runs as a demo with sample leads.
------------------------------------------------------------------- */
const CONFIG = { GOOGLE_CLIENT_ID: '', IDLE_MINUTES: 30, REFRESH_SECONDS: 60 };
let DEMO = true;

const MAIN_PATH = ['New', 'Calling', 'Contacted', 'Booked', 'Registered'];
const SIDE = ['Follow-up later', 'No-show', 'Marketing only', 'Lost'];
const RULES = {
  queue: 'Every lead due for a call, most urgent first.',
  'New': 'Welcome email sent. Call 1 within 30 minutes.',
  'Calling': 'Call 2 within 3 hours. Call 3 next business day.',
  'Contacted': 'Spoke to them. Add notes, set the next step.',
  'Booked': 'Intake set. Reminder goes out the day before.',
  'Registered': 'Rostered as a patient.',
  'Follow-up later': 'Wants info first. Call on the date set.',
  'No-show': 'Missed the intake. Reschedule email sent.',
  'Marketing only': 'No answer to 3 calls. Two emails, then it stops.',
  'Lost': 'Closed, with a reason.'
};
const NEXT_STEPS = {
  'Contacted': ['Follow-up later', 'Booked', 'Lost'],
  'Follow-up later': ['Contacted', 'Booked', 'Lost'],
  'Booked': ['Registered', 'No-show', 'Lost'],
  'No-show': ['Booked', 'Follow-up later', 'Lost'],
  'Marketing only': ['Contacted', 'Lost'],
  'Lost': ['Contacted'],
  'Registered': []
};
const STEP_LABEL = {
  'Contacted': s => s === 'Marketing only' ? 'They replied or called back' : (s === 'Lost' ? 'Reopen' : 'Spoke to them'),
  'Follow-up later': () => 'Follow up later', 'Booked': () => 'Book intake', 'Registered': () => 'Mark registered',
  'No-show': () => 'Mark no-show', 'Lost': () => 'Close lead'
};
const DAYNAMES = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

const S = {
  token: null, me: null, location: null, leads: [], filter: 'queue', selected: null,
  detail: null, activity: [], step: null, busy: false, error: ''
};

/* ---------------- Utilities ---------------- */
const $ = sel => document.querySelector(sel);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtTime = d => new Date(d).toLocaleTimeString('en-CA', { hour: 'numeric', minute: '2-digit' });
const fmtDay = d => {
  const x = new Date(d), now = new Date();
  const same = (a, b) => a.toDateString() === b.toDateString();
  const tmw = new Date(now); tmw.setDate(now.getDate() + 1);
  const yst = new Date(now); yst.setDate(now.getDate() - 1);
  if (same(x, now)) return 'today';
  if (same(x, tmw)) return 'tomorrow';
  if (same(x, yst)) return 'yesterday';
  return x.toLocaleDateString('en-CA', { weekday: 'short', month: 'short', day: 'numeric' });
};
const fmtWhen = d => d ? fmtDay(d) + ' ' + fmtTime(d) : '';
const ago = d => {
  const m = Math.round((Date.now() - new Date(d)) / 6e4);
  if (m < 1) return 'just now';
  if (m < 60) return m + ' min ago';
  const h = Math.round(m / 60);
  if (h < 24) return h + ' h ago';
  return fmtDay(d);
};
const phonePretty = p => {
  const d = String(p || '').replace(/\D/g, '');
  const t = d.length === 11 && d[0] === '1' ? d.slice(1) : d;
  return t.length === 10 ? '(' + t.slice(0, 3) + ') ' + t.slice(3, 6) + '-' + t.slice(6) : (p || '');
};
const fullName = l => (l.firstName + ' ' + (l.lastName || '')).trim() || 'No name';
const doneCalls = l => l.calls.filter(c => c.outcome).length;
const nextCall = l => doneCalls(l) + 1;
function toast(msg, isErr) {
  const host = $('#toast-host');
  host.innerHTML = '<div class="toast' + (isErr ? ' err' : '') + '">' + esc(msg) + '</div>';
  clearTimeout(toast.t); toast.t = setTimeout(() => { host.innerHTML = ''; }, 3500);
}
function localInputValue(d) {
  const x = new Date(d); const p = n => String(n).padStart(2, '0');
  return x.getFullYear() + '-' + p(x.getMonth() + 1) + '-' + p(x.getDate()) + 'T' + p(x.getHours()) + ':' + p(x.getMinutes());
}

/* ---------------- Opening hours (shared by demo and booking warnings) ---------------- */
const HOURS_SEED = {
  Georgetown: {
    pharmacy: ['Closed', '09:00-18:00', '09:00-18:00', '09:00-18:00', '09:00-18:00', '09:00-18:00', '10:00-15:00'],
    doctor: ['Closed', '09:00-17:00', 'Closed', '09:00-17:00', '09:00-17:00', 'Closed', '10:00-15:00']
  },
  Hanover: {
    pharmacy: ['10:00-15:00', '09:00-18:00', '09:00-18:00', '09:00-18:00', '09:00-18:00', '09:00-18:00', '10:00-15:00'],
    doctor: ['Closed', '09:00-18:00', '09:00-18:00', 'Closed', '09:00-18:00', '09:00-15:00', 'Closed']
  }
};
const CLOSED_SEED = ['2026-10-12', '2026-12-25', '2026-12-26', '2027-01-01'];
const hoursMap = () => (S.me && S.me.hours) || HOURS_SEED;
const closedList = () => (S.me && S.me.closedDates) || CLOSED_SEED;
const ymd = d => { const p = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()); };
function hoursFor(loc, kind, d) {
  if (closedList().includes(ymd(d))) return null;
  const raw = hoursMap()[loc][kind][d.getDay()];
  const m = /^(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})$/.exec(String(raw).trim());
  return m ? { open: +m[1] * 60 + +m[2], close: +m[3] * 60 + +m[4] } : null;
}
const at = (d, mins) => { const x = new Date(d); x.setHours(Math.floor(mins / 60), mins % 60, 0, 0); return x; };
const addMin = (d, m) => new Date(new Date(d).getTime() + m * 6e4);
function nextOpen(loc, d) {
  for (let i = 0; i < 9; i++) {
    const day = new Date(d); day.setDate(day.getDate() + i);
    const h = hoursFor(loc, 'pharmacy', day); if (!h) continue;
    const o = at(day, h.open), c = at(day, h.close);
    if (i === 0) { if (d < o) return o; if (d < c) return new Date(d); continue; }
    return o;
  }
  return null;
}
function closeOf(loc, d) {
  const h = hoursFor(loc, 'pharmacy', d); if (!h) return null;
  const o = at(d, h.open), c = at(d, h.close);
  return d >= o && d < c ? c : null;
}
function call1Due(loc, created) {
  const c = new Date(created), o = nextOpen(loc, c);
  if (+o === +c) { const cl = closeOf(loc, c); let due = addMin(c, 30); if (due > cl) due = (cl - c >= 6e5) ? cl : addMin(nextOpen(loc, cl), 30); return due; }
  return addMin(o, 30);
}
function call2Due(loc, t) {
  t = new Date(t); const due = addMin(t, 180), cl = closeOf(loc, t);
  if (cl && due <= cl) return due;
  return addMin(nextOpen(loc, cl || t), 60);
}
function call3Due(loc, t) {
  const nd = new Date(t); nd.setDate(nd.getDate() + 1); nd.setHours(0, 0, 0, 0);
  const o = nextOpen(loc, nd); return closeOf(loc, o);
}
function doctorWarning(loc, value) {
  if (!value) return '';
  const d = new Date(value); if (isNaN(d)) return '';
  if (closedList().includes(ymd(d))) return 'Both sites are closed on that date.';
  const h = hoursFor(loc, 'doctor', d);
  if (!h) return 'No doctor on site at ' + loc + ' on ' + DAYNAMES[d.getDay()] + 's. Pick another day.';
  const mins = d.getHours() * 60 + d.getMinutes();
  if (mins < h.open || mins >= h.close) return 'The doctor is on site from ' + fmtTime(at(d, h.open)) + ' to ' + fmtTime(at(d, h.close)) + ' that day.';
  return '';
}

/* ---------------- API ---------------- */
async function api(action, payload) {
  if (DEMO) return demoApi(action, payload || {});
  let out;
  try {
    const res = await fetch('/api/crm', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({ action, token: S.token, location: S.location }, payload || {}))
    });
    out = await res.json();
  } catch (e) {
    throw new Error('Could not reach the server. Check your connection and try again.');
  }
  if (!out.ok) {
    if (out.error === 'signin' || out.error === 'not-approved') { signOut(out.message); throw new Error(out.message); }
    throw new Error(out.message || 'Request failed.');
  }
  return out.data;
}

/* ---------------- Derived views ---------------- */
function inQueue(l) {
  if (!l.nextDue) return false;
  if (l.stage === 'Follow-up later') { const end = new Date(); end.setHours(23, 59, 59, 999); return new Date(l.nextDue) <= end; }
  return ['New', 'Calling'].includes(l.stage);
}
function visibleLeads() {
  const list = S.filter === 'queue' ? S.leads.filter(inQueue) : S.leads.filter(l => l.stage === S.filter);
  if (S.filter === 'queue') return list.sort((a, b) => new Date(a.nextDue) - new Date(b.nextDue));
  return list.sort((a, b) => new Date(b.created) - new Date(a.created));
}
function dueChip(l) {
  if (!l.nextDue) return '';
  const due = new Date(l.nextDue), diff = (due - Date.now()) / 6e4;
  const what = l.stage === 'Follow-up later' ? 'Follow-up' : 'Call ' + nextCall(l);
  if (diff < 0) {
    const m = Math.round(-diff);
    return '<span class="due late">' + what + ' overdue ' + (m < 60 ? m + ' min' : Math.round(m / 60) + ' h') + '</span>';
  }
  if (diff <= 10) return '<span class="due soon">' + what + ' due in ' + Math.max(1, Math.round(diff)) + ' min</span>';
  return '<span class="due">' + what + ' due ' + fmtWhen(due) + '</span>';
}
function callTags(l) {
  return l.calls.filter(c => c.outcome).map(c =>
    '<span class="tag' + (c.outcome === 'Spoke to them' ? ' ok' : '') + '">Call ' + c.n + ': ' + esc(c.outcome) + ', ' + fmtTime(c.at) + '</span>').join('');
}
function counts() {
  const c = { queue: S.leads.filter(inQueue).length };
  MAIN_PATH.concat(SIDE).forEach(s => { c[s] = S.leads.filter(l => l.stage === s).length; });
  return c;
}
function stats() {
  const due = S.leads.filter(inQueue);
  const overdue = due.filter(l => new Date(l.nextDue) < Date.now()).length;
  const nextHour = due.filter(l => { const d = new Date(l.nextDue) - Date.now(); return d >= 0 && d <= 36e5; }).length;
  const weekAgo = Date.now() - 7 * 864e5;
  const recent = S.leads.filter(l => new Date(l.created) >= weekAgo);
  const timed = recent.filter(l => l.calls[0].at);
  const onTime = timed.filter(l => new Date(l.calls[0].at) <= call1Due(S.location, l.created)).length;
  return { overdue, nextHour, onTime: timed.length ? Math.round(onTime / timed.length * 100) + '%' : 'n/a' };
}

  const facts = [
    ['Reason', l.reason], ['Source', l.source + (l.channel ? ', ' + l.channel : '')],
    ['Received', fmtWhen(l.created)], ['First opened', l.firstOpenedAt ? fmtWhen(l.firstOpenedAt) + ' by ' + l.firstOpenedBy : 'Not yet'],
    ['Owner', l.owner || 'Unassigned'], ['Lead ID', l.id]
  ];
  if (l.appointment) facts.push(['Intake', fmtWhen(l.appointment)]);
  if (l.followUp && l.stage === 'Follow-up later') facts.push(['Follow-up', fmtWhen(l.followUp)]);
  if (l.lostReason && l.stage === 'Lost') facts.push(['Closed because', l.lostReason]);
  if (l.submissions > 1) facts.push(['Submitted', l.submissions + ' times']);

  const emails = [['Welcome', l.welcomeAt], ['We tried to reach you', l.mkt1At], ['Check-in', l.mkt2At]].filter(e => e[1]);

  return '<aside class="panel open" aria-label="Lead details">' +
    '<div class="p-head"><div><h2>' + esc(fullName(l)) + '</h2><span class="stage">' + esc(l.stage) + '</span></div>' +
    '<button class="btn ghost close" data-act="close" aria-label="Close lead">Close</button></div>' +
    '<div class="p-body">' +
      '<div class="contact">' + (l.phone ? '<a class="dial" href="tel:' + esc(l.phone) + '" data-act="dial">Call ' + esc(phonePretty(l.phone)) + '</a>' : '') +
        (l.email ? '<a class="mail" href="mailto:' + esc(l.email) + '">' + esc(l.email) + '</a>' : '') + '</div>' +
      '<dl class="facts">' + facts.map(f => '<div><dt>' + esc(f[0]) + '</dt><dd>' + esc(f[1]) + '</dd></div>').join('') + '</dl>' +

      (callable ? '<div class="block"><h3>Call ' + n + ' of 3</h3><p class="hint">' + (l.nextDue ? dueChip(l) + ' ' : '') +
        'How did it go?</p><div class="outcomes">' +
        '<button class="outcome good" data-outcome="Spoke to them">Spoke to them</button>' +
        '<button class="outcome" data-outcome="No answer">No answer</button>' +
        '<button class="outcome" data-outcome="Voicemail left">Voicemail left</button>' +
        '<button class="outcome" data-outcome="Busy, call back">Busy, call back</button>' +
        '<button class="outcome bad" data-outcome="Wrong number">Wrong number</button></div>' +
        (n === 3 ? '<p class="hint" style="margin-top:10px">If call 3 goes unanswered, the lead moves to Marketing only and gets the "we tried to reach you" email.</p>' : '') +
      '</div>' : '') +

      (l.calls.some(c => c.at) ? '<div class="block"><h3>Calls</h3><ul class="calllog">' + l.calls.filter(c => c.at).map(c =>
        '<li><b>Call ' + c.n + '</b> ' + (c.outcome ? esc(c.outcome) : 'dialled, outcome not logged') + ', ' + fmtWhen(c.at) + (c.by ? ' by ' + esc(c.by) : '') + '</li>').join('') + '</ul></div>' : '') +

      (steps.length ? '<div class="block"><h3>Next step</h3><div class="steps">' + steps.map(s =>
        '<button class="step" data-step="' + esc(s) + '" aria-pressed="' + (S.step === s) + '">' + esc(STEP_LABEL[s](l.stage)) + '</button>').join('') +
        (l.stage === 'Booked' ? '<button class="step" data-step="reschedule" aria-pressed="' + (S.step === 'reschedule') + '">Move intake</button>' : '') +
        '</div>' + stepForm(l) + '</div>' : '') +

      (!['New', 'Calling'].includes(l.stage) ? '<div class="block"><h3>Lead quality</h3><p class="hint">Your read on this person after speaking to them.</p><div class="seg-ctl" role="group" aria-label="Lead quality">' +
        ['Good', 'OK', 'Poor'].map(q => '<button data-quality="' + q + '" aria-pressed="' + (l.quality === q) + '">' + q + '</button>').join('') + '</div></div>' : '') +

      '<div class="block"><h3>Notes</h3><label class="sr" for="note">Add a note</label><textarea id="note" placeholder="What did they say? What happens next?"></textarea>' +
        '<div style="margin-top:8px"><button class="btn small" data-act="note">Add note</button></div>' +
        (l.notes ? '<div class="notes">' + esc(l.notes) + '</div>' : '') + '</div>' +

      (emails.length ? '<div class="block"><h3>Emails sent</h3><ul class="log">' + emails.map(e => '<li><time>' + fmtWhen(e[1]) + '</time>' + esc(e[0]) + '</li>').join('') + '</ul></div>' : '') +

      (S.activity.length ? '<div class="block"><h3>Activity</h3><ul class="log">' + S.activity.slice(0, 20).map(a =>
        '<li><time>' + fmtWhen(a.at) + '</time>' + esc(a.staff) + ': ' + esc(a.action) + (a.to ? ' (' + esc(a.from ? a.from + ' to ' + a.to : a.to) + ')' : '') + (a.detail ? ', ' + esc(a.detail) : '') + '</li>').join('') + '</ul></div>' : '') +
    '</div></aside>';
}
function stepForm(l) {
  const s = S.step;
  if (!s) return '';
  const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate() + 1); tomorrow.setHours(10, 0, 0, 0);
  if (s === 'Booked' || s === 'reschedule') {
    const v = l.appointment ? localInputValue(l.appointment) : localInputValue(tomorrow);
    return '<div class="form"><label>Intake date and time<input type="datetime-local" id="appt" value="' + v + '"></label>' +
      '<div id="apptwarn">' + warnHtml(doctorWarning(S.location, v)) + '</div>' +
      '<div><button class="btn primary" data-confirm="' + esc(s) + '">' + (s === 'reschedule' ? 'Move intake' : 'Book intake') + '</button></div></div>';
  }
  if (s === 'Follow-up later') {
    return '<div class="form"><label>Call them again on<input type="datetime-local" id="fu" value="' + localInputValue(tomorrow) + '"></label>' +
      '<div><button class="btn primary" data-confirm="Follow-up later">Set follow-up</button></div></div>';
  }
  if (s === 'Lost') {
    const reasons = (S.me.lostReasons || ['Not interested', 'Found another doctor', 'Outside catchment', 'Wrong location', 'Wrong number', 'Duplicate', 'Spam, fake or test']);
    return '<div class="form"><label>Why is this lead closing?<select id="lost"><option value="">Pick a reason</option>' +
      reasons.map(r => '<option>' + esc(r) + '</option>').join('') + '</select></label>' +
      '<div><button class="btn primary" data-confirm="Lost">Close lead</button></div></div>';
  }
  const label = STEP_LABEL[s](l.stage);
  return '<div class="form"><p style="margin:0">Move to <b>' + esc(s) + '</b>?</p><div><button class="btn primary" data-confirm="' + esc(s) + '">' + esc(label) + '</button></div></div>';
}
const warnHtml = w => w ? '<div class="warn">' + esc(w) + '</div>' : '';

/* ---------------- Actions ---------------- */
async function openLead(id) {
  S.selected = id; S.step = null;
  S.detail = S.leads.find(l => l.id === id) || null; S.activity = [];
  render();
  try {
    const out = await api('open', { id });
    applyLead(out.lead); S.activity = out.activity || []; render();
  } catch (e) { toast(e.message, true); }
}
function applyLead(lead) {
  const i = S.leads.findIndex(l => l.id === lead.id);
  if (i === -1) S.leads.push(lead); else S.leads[i] = lead;
  if (S.selected === lead.id) S.detail = lead;
}
async function refreshActivity() {
  if (!S.selected) return;
  try { const out = await api('open', { id: S.selected }); applyLead(out.lead); S.activity = out.activity || []; } catch (e) { /* keep current */ }
}
async function run(fn, okMsg) {
  if (S.busy) return;
  S.busy = true;
  try { const out = await fn(); if (out && out.lead) applyLead(out.lead); await refreshActivity(); S.step = null; render(); if (okMsg) toast(okMsg); }
  catch (e) { toast(e.message, true); }
  finally { S.busy = false; }
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-demo],[data-filter],[data-open],[data-act],[data-outcome],[data-step],[data-confirm],[data-quality]');
  if (!t) return;
  if (t.dataset.demo) return boot(t.dataset.demo);
  if (t.dataset.filter) { S.filter = t.dataset.filter; render(); return; }
  if (t.dataset.open) return openLead(t.dataset.open);
  const l = S.detail;
  if (t.dataset.outcome && l) {
    const n = nextCall(l), o = t.dataset.outcome;
    const msg = o === 'Spoke to them' ? 'Moved to Contacted' : o === 'Wrong number' ? 'Closed as wrong number' : n === 3 ? 'No answer to 3 calls. Moved to Marketing only' : 'Call ' + n + ' logged. Call ' + (n + 1) + ' is now due';
    return run(() => api('logCall', { id: l.id, call: n, outcome: o }), msg);
  }
  if (t.dataset.step) { S.step = S.step === t.dataset.step ? null : t.dataset.step; render(); return; }
  if (t.dataset.confirm && l) {
    const s = t.dataset.confirm, fields = {};
    if (s === 'reschedule') { fields.appointment = ($('#appt') || {}).value; if (!fields.appointment) return toast('Set the intake date and time.', true); return run(() => api('update', { id: l.id, fields }), 'Intake moved'); }
    fields.stage = s;
    if (s === 'Booked') fields.appointment = ($('#appt') || {}).value;
    if (s === 'Follow-up later') fields.followUp = ($('#fu') || {}).value;
    if (s === 'Lost') { fields.lostReason = ($('#lost') || {}).value; if (!fields.lostReason) return toast('Pick a reason for closing this lead.', true); }
    return run(() => api('update', { id: l.id, fields }), 'Moved to ' + s);
  }
  if (t.dataset.quality && l) {
    const q = l.quality === t.dataset.quality ? '' : t.dataset.quality;
    return run(() => api('update', { id: l.id, fields: { quality: q } }), q ? 'Lead quality: ' + q : 'Lead quality cleared');
  }
  switch (t.dataset.act) {
    case 'signout': return signOut();
    case 'close': S.selected = null; S.detail = null; S.step = null; return render();
    case 'add': return openAddDialog();
    case 'note': {
      const v = ($('#note') || {}).value || '';
      if (!v.trim()) return toast('Write a note first.', true);
      return run(() => api('update', { id: l.id, fields: { note: v } }), 'Note added');
    }
    case 'dial': if (l) api('dial', { id: l.id }).then(out => { applyLead(out.lead); render(); }).catch(() => {}); return; // let the tel: link dial
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'locsel') { S.location = e.target.value; S.selected = null; S.detail = null; S.filter = 'queue'; loadList(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'appt') { const w = $('#apptwarn'); if (w) w.innerHTML = warnHtml(doctorWarning(S.location, e.target.value)); }
});

function openAddDialog() {
  let d = $('#adddlg');
  if (!d) { d = document.createElement('dialog'); d.id = 'adddlg'; d.className = 'dlg'; document.body.appendChild(d); }
  d.innerHTML = '<form method="dialog" id="addform"><h2>Add a lead</h2>' +
    '<p style="margin:0;color:var(--ink-2);font-size:14px">For walk-ins and phone calls. It goes straight into ' + esc(S.location) + "'s list as New.</p>" +
    '<div class="two"><label>First name<input name="firstName" required autocomplete="off"></label><label>Last name<input name="lastName" autocomplete="off"></label></div>' +
    '<label>Phone<input name="phone" type="tel" autocomplete="off"></label><label>Email<input name="email" type="email" autocomplete="off"></label>' +
    '<label>What do they need?<select name="reason"><option>New patient registration</option><option>Learn more before registering</option><option>Pharmacy question</option><option>Other</option></select></label>' +
    '<label>How did they reach us?<select name="source"><option>Walk-in</option><option>Phone call</option><option>Referral</option><option>Other</option></select></label>' +
    '<div class="actions"><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn primary" value="save">Add lead</button></div></form>';
  d.showModal();
  d.onclose = () => {
    if (d.returnValue !== 'save') return;
    const f = new FormData($('#addform')); const lead = Object.fromEntries(f.entries());
    run(async () => { const out = await api('addLead', { lead }); S.filter = 'queue'; S.selected = out.lead.id; S.detail = out.lead; return out; }, 'Lead added');
  };
}

async function start() {
  const forceDemo = new URLSearchParams(location.search).has('demo');
  if (!forceDemo && location.protocol.startsWith('http')) {
    try {
      const res = await fetch('/api/config', { cache: 'no-store' });
      if (res.ok) {
        const cfg = await res.json();
        if (cfg.googleClientId) { CONFIG.GOOGLE_CLIENT_ID = cfg.googleClientId; CONFIG.IDLE_MINUTES = cfg.idleMinutes || 30; DEMO = false; }
      }
    } catch (e) { /* no server: demo mode */ }
  }
  if (!DEMO && 'serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
  renderGate();
}
start();
</script>
</body>
</html>
